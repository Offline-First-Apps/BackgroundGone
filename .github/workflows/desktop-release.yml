name: Desktop – Windows build

# Builds the Windows installer on a clean Windows runner (no local OneDrive /
# antivirus / symlink issues). Downloads the ONNX model, builds the Tauri app,
# uploads the installer as an artifact, and (if R2 secrets are set) pushes it to R2.

on:
  workflow_dispatch: # run manually from the Actions tab
  push:
    tags:
      - "v*" # or on a version tag

jobs:
  build:
    runs-on: windows-latest
    env:
      # prisma generate (packages/db postinstall) needs this var to resolve during
      # `pnpm install`. It is NOT used to connect — any valid-looking URL works.
      DATABASE_URL: "postgresql://user:pass@localhost:5432/db?schema=public"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Download ONNX model
        shell: pwsh
        run: |
          $dir = "apps/desktop/src-tauri/models"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $url = "https://huggingface.co/onnx-community/ormbg-ONNX/resolve/main/onnx/model_fp16.onnx"
          Invoke-WebRequest -Uri $url -OutFile "$dir/model_fp16.onnx"
          Get-Item "$dir/model_fp16.onnx" | Select-Object Name, Length

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build desktop (Tauri)
        run: pnpm --filter desktop exec tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: backgroundgone-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi

      # Optional: push the installer to Cloudflare R2 (S3-compatible).
      # Set these repo secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
      # R2_SECRET_ACCESS_KEY, R2_BUCKET. Skipped automatically if unset.
      - name: Upload to R2
        if: ${{ env.R2_ACCOUNT_ID != '' }}
        shell: pwsh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          $endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          $exe = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          aws s3 cp "$($exe.FullName)" "s3://$env:R2_BUCKET/BackgroundGone-Setup.exe" `
            --endpoint-url $endpoint --content-disposition "attachment; filename=BackgroundGone-Setup.exe"
