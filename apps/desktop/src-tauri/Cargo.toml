[package]
name = "desktop"
version = "0.1.0"
description = "BackgroundGone — local-first background remover"
authors = ["BackgroundGone"]
edition = "2021"

# The library that main.rs (and, later, mobile entry points) call into.
[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ONNX Runtime. Model I/O is float32 (confirmed from the graph), so no `half`.
ort = "2"
image = "0.25"

[features]
# Compile-time GPU inference providers (see MODEL_INTEGRATION plan). Ship
# CPU-only by default; enable per platform once benchmarked.
default = []
directml = ["ort/directml"]
coreml = ["ort/coreml"]
cuda = ["ort/cuda"]
