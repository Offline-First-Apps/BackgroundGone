[package]
name = "desktop"
version = "0.1.0"
description = "BackgroundGone — local-first background remover"
authors = ["BackgroundGone"]
edition = "2021"

# The library that main.rs (and, later, mobile entry points) call into.
[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Compile-time GPU inference providers for the (future) ONNX Runtime engine.
# Ship CPU-only by default; enable per platform when the model is wired in.
default = []
directml = []
coreml = []
cuda = []
